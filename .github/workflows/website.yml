name: Website checks
on:
  push:
    branches: [codex/website]
  pull_request:
    branches: [codex/website]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
      - run: npx wrangler pages functions build functions --outdir .wrangler/functions-check
